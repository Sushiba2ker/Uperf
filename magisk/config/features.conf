# Uperf runtime feature switches.
# Values: 1/on/true/enabled or 0/off/false/disabled.
# Missing keys default to enabled for upgrade compatibility.
# module_enabled=0 stops Uperf scripts and daemons; reboot may be needed
# before static Magisk overlays and kernel values are fully reverted.
module_enabled=1
uperf=1
powercfg=1
powercfg_once=1
kernel_tweaks=1
system_tweaks=1
gms_freeze=1
gms_doze=1
thermal_guard=1
ram_clean=1
zram_compact=1
google_jobs=1
