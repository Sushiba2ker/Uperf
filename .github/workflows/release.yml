name: Build and publish release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build flashable module
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release metadata and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          module_version="$(awk -F= '$1 == "version" { print $2; exit }' magisk/module.prop)"
          if [ -z "$module_version" ]; then
            echo "::error::magisk/module.prop is missing version."
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$module_version" != "$tag_version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} must match magisk/module.prop version (${module_version})."
              exit 1
            fi
          fi

          find magisk -type f -name '*.sh' -exec sh -n {} \;

      - name: Build module archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          module_version="$(awk -F= '$1 == "version" { print $2; exit }' magisk/module.prop)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            archive="Uperf-Sushiba-${GITHUB_REF_NAME}.zip"
          else
            archive="Uperf-Sushiba-v${module_version}-${GITHUB_SHA::7}.zip"
          fi
          rm -f "$archive"
          (
            cd magisk
            zip -qr "$GITHUB_WORKSPACE/$archive" . -x '*/.DS_Store' '.DS_Store'
          )
          test -s "$archive"
          unzip -t "$archive"
          manifest="$(mktemp)"
          module_prop="$(mktemp)"
          runtime_registry="$(mktemp)"
          trap 'rm -f "$manifest" "$module_prop" "$runtime_registry"' EXIT
          unzip -Z1 "$archive" > "$manifest"
          if grep -Eq '(^|/)\.DS_Store$' "$manifest"; then
            echo "::error::The release archive contains .DS_Store."
            exit 1
          fi
          grep -Fxq 'module.prop' "$manifest"
          grep -Fxq 'script/feature_runtime.sh' "$manifest"
          unzip -p "$archive" module.prop > "$module_prop"
          grep -q '^id=uperf$' "$module_prop"
          unzip -p "$archive" script/feature_runtime.sh > "$runtime_registry"
          grep -q '^STARTUP_FEATURES=' "$runtime_registry"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Upload module artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Uperf $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --latest
